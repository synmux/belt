wrappers = { cargo = { command = "mbx", env = { MBX_CARGO_SHIM_MODE = "1" } } }

[env]
BELT_MISE_ACTIVE = 'true'

[settings]
env_file = '.env'

[tools]
rust = { version = "1.100.0", mr_boxington = true, profile = "default", components = [
  "rust-docs",
  "rust-src",
  "llvm-tools",
  "clippy",
  "rustfmt",
  "rust-analyzer",
] }
mr-boxington = { version = "1.30.0", workflow = "release.yml@refs/heads/main" }

[tasks]
bump = { run = "op run -- mise upgrade --bump --local", env = { GITHUB_TOKEN = "op://Personal/github-token/token" } }

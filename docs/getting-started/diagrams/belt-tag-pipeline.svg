<svg xmlns="http://www.w3.org/2000/svg" id="belt-tag-pipeline-root" aria-labelledby="belt-tag-pipeline-title belt-tag-pipeline-desc" style="--color-paper:#f5f5f5;--color-ink:#2d3142;--color-muted:#4f5d75;--color-accent:#bf4520;--font-sans:'Geist', system-ui, sans-serif;--font-serif:'Instrument Serif', serif;--font-mono:'Geist Mono', ui-monospace, monospace;font-family:var(--font-sans);color:var(--color-ink)" viewBox="0 0 1280 720"><title id="belt-tag-pipeline-title">belt tag: from bytes to three words</title><desc id="belt-tag-pipeline-desc">Pipeline showing belt tag reading a file or stdin, hashing it with BLAKE2b-512 into a 64-byte digest, keeping the first 4 bytes, encoding them as Bytewords with one word per byte plus a CRC32 checksum, dropping the 4 checksum words, and printing a four-word tag such as also-code-wave-list.</desc><defs><marker id="belt-tag-pipeline-arrow" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#4f5d75" d="m0 0 8 3-8 3z"/></marker><marker id="belt-tag-pipeline-arrow-accent" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#bf4520" d="m0 0 8 3-8 3z"/></marker><marker id="belt-tag-pipeline-arrow-link" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#2e5aa8" d="m0 0 8 3-8 3z"/></marker><style>@import url(https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap);</style></defs><rect width="100%" height="100%" fill="#f5f5f5"/><path fill="none" stroke="#4f5d75" marker-end="url(#belt-tag-pipeline-arrow)" d="M320 156h179"/><rect width="112" height="16" x="354" y="132" fill="#f5f5f5" rx="2"/><text x="410" y="144" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" letter-spacing=".06em" text-anchor="middle">8 KIB CHUNKS</text><path fill="none" stroke="#4f5d75" marker-end="url(#belt-tag-pipeline-arrow)" d="M780 156h179"/><path fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#belt-tag-pipeline-arrow-accent)" d="M1100 216v76q0 8-8 8H188q-8 0-8 8v75"/><rect width="112" height="16" x="584" y="276" fill="#f5f5f5" rx="2"/><text x="640" y="288" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" letter-spacing=".06em" text-anchor="middle">KEEP 4 OF 64</text><path fill="none" stroke="#4f5d75" marker-end="url(#belt-tag-pipeline-arrow)" d="M320 444h179"/><rect width="72" height="16" x="374" y="420" fill="#f5f5f5" rx="2"/><text x="410" y="432" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" letter-spacing=".06em" text-anchor="middle">4 BYTES</text><path fill="none" stroke="#4f5d75" marker-end="url(#belt-tag-pipeline-arrow)" d="M780 444h179"/><rect width="120" height="16" x="810" y="420" fill="#f5f5f5" rx="2"/><text x="870" y="432" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" letter-spacing=".06em" text-anchor="middle">FIRST 4 WORDS</text><rect width="280" height="120" x="40" y="96" fill="#f5f5f5" rx="6"/><rect width="280" height="120" x="40" y="96" fill="#4f5d75" fill-opacity=".1" stroke="#5a6580" rx="6"/><rect width="28" height="16" x="52" y="108" fill="none" stroke="#5a6580" stroke-opacity=".4" stroke-width=".8" rx="2"/><text x="66" y="120" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" letter-spacing=".08em" text-anchor="middle">01</text><text x="180" y="148" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">FILE or stdin</text><text x="180" y="170" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">clio::Input</text><text x="180" y="186" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">path, or - for stdin</text><rect width="280" height="120" x="500" y="96" fill="#f5f5f5" rx="6"/><rect width="280" height="120" x="500" y="96" fill="#fff" stroke="#2d3142" rx="6"/><rect width="28" height="16" x="512" y="108" fill="none" stroke="#2d3142" stroke-opacity=".4" stroke-width=".8" rx="2"/><text x="526" y="120" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" letter-spacing=".08em" text-anchor="middle">02</text><text x="640" y="148" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">BLAKE2b-512</text><text x="640" y="170" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">blake2::Blake2b512</text><rect width="280" height="120" x="960" y="96" fill="#f5f5f5" rx="6"/><rect width="280" height="120" x="960" y="96" fill="#2d3142" fill-opacity=".05" stroke="#4f5d75" rx="6"/><rect width="28" height="16" x="972" y="108" fill="none" stroke="#4f5d75" stroke-opacity=".4" stroke-width=".8" rx="2"/><text x="986" y="120" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" letter-spacing=".08em" text-anchor="middle">03</text><text x="1100" y="148" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">64-byte digest</text><text x="1100" y="170" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">512 bits</text><rect width="280" height="120" x="40" y="384" fill="#f5f5f5" rx="6"/><rect width="280" height="120" x="40" y="384" fill="#bf4520" fill-opacity=".08" stroke="#bf4520" stroke-width="1.2" rx="6"/><rect width="28" height="16" x="52" y="396" fill="none" stroke="#bf4520" stroke-opacity=".5" stroke-width=".8" rx="2"/><text x="66" y="408" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" letter-spacing=".08em" text-anchor="middle">04</text><text x="180" y="436" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">First 4 bytes</text><text x="180" y="458" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">&amp;digest[..4]</text><rect width="280" height="120" x="500" y="384" fill="#f5f5f5" rx="6"/><rect width="280" height="120" x="500" y="384" fill="#fff" stroke="#2d3142" rx="6"/><rect width="28" height="16" x="512" y="396" fill="none" stroke="#2d3142" stroke-opacity=".4" stroke-width=".8" rx="2"/><text x="526" y="408" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" letter-spacing=".08em" text-anchor="middle">05</text><text x="640" y="436" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Bytewords encode</text><text x="640" y="458" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">ur::bytewords::encode</text><text x="640" y="474" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">Style::Uri</text><text x="640" y="490" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">4 bytes + CRC32 = 8 words</text><rect width="280" height="120" x="960" y="384" fill="#f5f5f5" rx="6"/><rect width="280" height="120" x="960" y="384" fill="#4f5d75" fill-opacity=".1" stroke="#5a6580" rx="6"/><rect width="28" height="16" x="972" y="396" fill="none" stroke="#5a6580" stroke-opacity=".4" stroke-width=".8" rx="2"/><text x="986" y="408" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" letter-spacing=".08em" text-anchor="middle">06</text><text x="1100" y="436" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">also-code-wave-list</text><text x="1100" y="458" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">word-word-word-word</text><text x="1100" y="474" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">checksum words dropped</text><text x="1100" y="490" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">printed to stdout</text><path fill="none" stroke="#2d3142" stroke-dasharray="4,3" stroke-opacity=".4" d="M640 508v56"/><circle cx="640" cy="504" r="2" fill="#2d3142"/><text x="640" y="588" fill="#2d3142" font-family="'Instrument Serif', serif" font-size="16" font-style="italic" text-anchor="middle">One byte, one word. No modulo, no bias.</text><path stroke="#2d3142" stroke-opacity=".1" stroke-width=".8" d="M40 660h1200"/><text x="40" y="696" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" letter-spacing=".14em">LEGEND</text><rect width="24" height="16" x="160" y="684" fill="#4f5d75" fill-opacity=".1" stroke="#5a6580" rx="3"/><text x="196" y="696" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" letter-spacing=".08em">INPUT / OUTPUT</text><rect width="24" height="16" x="372" y="684" fill="#fff" stroke="#2d3142" rx="3"/><text x="408" y="696" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" letter-spacing=".08em">TRANSFORM</text><rect width="24" height="16" x="540" y="684" fill="#2d3142" fill-opacity=".05" stroke="#4f5d75" rx="3"/><text x="576" y="696" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" letter-spacing=".08em">VALUE</text><rect width="24" height="16" x="668" y="684" fill="#bf4520" fill-opacity=".08" stroke="#bf4520" stroke-width="1.2" rx="3"/><text x="704" y="696" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" letter-spacing=".08em">THE NARROWING</text></svg>
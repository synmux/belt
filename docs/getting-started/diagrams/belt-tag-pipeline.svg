<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="belt-tag-pipeline-title belt-tag-pipeline-desc" id="belt-tag-pipeline-root">
        <title id="belt-tag-pipeline-title">belt tag: from bytes to three words</title>
        <desc id="belt-tag-pipeline-desc">Pipeline showing belt tag reading a file or stdin, hashing it with BLAKE2b-512 into a 64-byte digest, keeping the first 4 bytes, encoding them as Bytewords with one word per byte plus a CRC32 checksum, dropping the 4 checksum words, and printing a four-word tag such as also-code-wave-list.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #belt-tag-pipeline-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #belt-tag-pipeline-root { font-family: var(--font-sans); color: var(--color-ink); }
      #belt-tag-pipeline-root .diagram-container { width: 100%; overflow-x: auto; }
      #belt-tag-pipeline-root .diagram-container { overflow-x: visible; }</style>
          <marker id="belt-tag-pipeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="belt-tag-pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="belt-tag-pipeline-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============ Connectors (drawn before nodes) ============ -->

        <!-- 01 Input -> 02 Hasher -->
        <path d="M 320 156 L 499 156" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#belt-tag-pipeline-arrow)"/>
        <rect x="354" y="132" width="112" height="16" rx="2" fill="#f5f5f5"/>
        <text x="410" y="144" fill="#5a6580" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">8 KIB CHUNKS</text>

        <!-- 02 Hasher -> 03 Digest -->
        <path d="M 780 156 L 959 156" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#belt-tag-pipeline-arrow)"/>

        <!-- 03 Digest -> 04 Slice: the focal narrowing, wraps to the second row -->
        <path d="M 1100 216 L 1100 292 Q 1100 300 1092 300 L 188 300 Q 180 300 180 308 L 180 383" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#belt-tag-pipeline-arrow-accent)"/>
        <rect x="584" y="276" width="112" height="16" rx="2" fill="#f5f5f5"/>
        <text x="640" y="288" fill="#bf4520" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">KEEP 4 OF 64</text>

        <!-- 04 Slice -> 05 Encode -->
        <path d="M 320 444 L 499 444" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#belt-tag-pipeline-arrow)"/>
        <rect x="374" y="420" width="72" height="16" rx="2" fill="#f5f5f5"/>
        <text x="410" y="432" fill="#5a6580" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">4 BYTES</text>

        <!-- 05 Encode -> 06 Output: trim drops the 4 checksum words -->
        <path d="M 780 444 L 959 444" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#belt-tag-pipeline-arrow)"/>
        <rect x="810" y="420" width="120" height="16" rx="2" fill="#f5f5f5"/>
        <text x="870" y="432" fill="#5a6580" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FIRST 4 WORDS</text>

        <!-- ============ Nodes ============ -->

        <!-- 01 Input (input treatment) -->
        <rect x="40" y="96" width="280" height="120" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="96" width="280" height="120" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#5a6580" stroke-width="1"/>
        <rect x="52" y="108" width="28" height="16" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="66" y="120" fill="#5a6580" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">01</text>
        <text x="180" y="148" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">FILE or stdin</text>
        <text x="180" y="170" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">clio::Input</text>
        <text x="180" y="186" fill="#5a6580" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">path, or - for stdin</text>

        <!-- 02 Hasher (backend) -->
        <rect x="500" y="96" width="280" height="120" rx="6" fill="#f5f5f5"/>
        <rect x="500" y="96" width="280" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="512" y="108" width="28" height="16" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="526" y="120" fill="#2d3142" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">02</text>
        <text x="640" y="148" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">BLAKE2b-512</text>
        <text x="640" y="170" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">blake2::Blake2b512</text>

        <!-- 03 Digest (store) -->
        <rect x="960" y="96" width="280" height="120" rx="6" fill="#f5f5f5"/>
        <rect x="960" y="96" width="280" height="120" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <rect x="972" y="108" width="28" height="16" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="986" y="120" fill="#4f5d75" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">03</text>
        <text x="1100" y="148" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">64-byte digest</text>
        <text x="1100" y="170" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">512 bits</text>

        <!-- 04 Slice (focal) -->
        <rect x="40" y="384" width="280" height="120" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="384" width="280" height="120" rx="6" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-width="1.2"/>
        <rect x="52" y="396" width="28" height="16" rx="2" fill="none" stroke="#bf4520" stroke-opacity="0.50" stroke-width="0.8"/>
        <text x="66" y="408" fill="#bf4520" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">04</text>
        <text x="180" y="436" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">First 4 bytes</text>
        <text x="180" y="458" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">&amp;digest[..4]</text>

        <!-- 05 Encode (backend) -->
        <rect x="500" y="384" width="280" height="120" rx="6" fill="#f5f5f5"/>
        <rect x="500" y="384" width="280" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="512" y="396" width="28" height="16" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="526" y="408" fill="#2d3142" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">05</text>
        <text x="640" y="436" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Bytewords encode</text>
        <text x="640" y="458" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ur::bytewords::encode</text>
        <text x="640" y="474" fill="#5a6580" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Style::Uri</text>
        <text x="640" y="490" fill="#5a6580" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">4 bytes + CRC32 = 8 words</text>

        <!-- 06 Output (input treatment: user-facing I/O) -->
        <rect x="960" y="384" width="280" height="120" rx="6" fill="#f5f5f5"/>
        <rect x="960" y="384" width="280" height="120" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#5a6580" stroke-width="1"/>
        <rect x="972" y="396" width="28" height="16" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="986" y="408" fill="#5a6580" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">06</text>
        <text x="1100" y="436" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">also-code-wave-list</text>
        <text x="1100" y="458" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">word-word-word-word</text>
        <text x="1100" y="474" fill="#5a6580" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">checksum words dropped</text>
        <text x="1100" y="490" fill="#5a6580" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">printed to stdout</text>

        <!-- ============ Annotation callout ============ -->
        <path d="M 640 508 L 640 564" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="640" cy="504" r="2" fill="#2d3142"/>
        <text x="640" y="588" fill="#2d3142" font-size="16" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">One byte, one word. No modulo, no bias.</text>

        <!-- ============ Legend strip ============ -->
        <line x1="40" y1="660" x2="1240" y2="660" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="40" y="696" fill="#4f5d75" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="160" y="684" width="24" height="16" rx="3" fill="#4f5d75" fill-opacity="0.10" stroke="#5a6580" stroke-width="1"/>
        <text x="196" y="696" fill="#4f5d75" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">INPUT / OUTPUT</text>

        <rect x="372" y="684" width="24" height="16" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="408" y="696" fill="#4f5d75" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">TRANSFORM</text>

        <rect x="540" y="684" width="24" height="16" rx="3" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <text x="576" y="696" fill="#4f5d75" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">VALUE</text>

        <rect x="668" y="684" width="24" height="16" rx="3" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-width="1.2"/>
        <text x="704" y="696" fill="#bf4520" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">THE NARROWING</text>
      </svg>

[package]
default-run = "belt"
description = "A CLI toolbelt"
edition = "2024"
license = "MIT"
name = "belt-cli"
publish = false
readme = "README.md"
repository = "https://github.com/synmux/belt"
version = "0.0.0-pre.0"

[dependencies]
apple-native-keyring-store = { version = "1.0.3", features = ["protected"] }
arboard = { version = "3.7.0", features = [
  "wayland-data-control",
  "wl-clipboard-rs",
] }
bip39 = { version = "3.0.0", features = ["serde"] }
blake2 = "0.11.0"
clap = { version = "4.6.10", features = [
  "derive",
  "env",
  "unicode",
  "wrap_help",
  "string",
  "suggestions",
  "error-context",
  "help",
  "usage",
  "color",
] }
clap_complete = "4.6.12"
clio = { version = "0.3.5", features = ["clap", "clap-parse"] }
clipboard-rs = { version = "0.3.5", features = ["wayland"] }
crossterm = { version = "0.29.0", features = ["serde", "osc52"] }
keyring = { version = "4.2.0", features = [
  "android-native-keyring-store",
  "apple-native-keyring-store",
  "dbus-secret-service-keyring-store",
  "linux-keyutils-keyring-store",
] }
keyring-core = "1.1.0"
qrcode = "0.15.0"
rand = { version = "0.10.4", default-features = false, features = [
  "std_rng",
  "sys_rng",
  "unbiased",
] }
ratatui = { version = "0.30.2", features = [
  "serde",
  "palette",
  "scrolling-regions",
  "crossterm",
] }
shadow-rs = { version = "2.0.0", features = [
  "cargo_metadata",
  "document-features",
  "serde_json",
  "metadata",
] }
tera = { version = "2.4.0", features = [
  "glob_fs",
  "unicode",
  "preserve_order",
  "fast",
] }
tera-contrib = { version = "0.3.0", features = [
  "rand",
  "base64",
  "filesize_format",
  "format",
  "json",
  "regex",
  "slug",
  "urlencode",
] }
ur = "0.5.2"

[[bin]]
name = "belt"
path = "src/main.rs"

[build-dependencies]
clap_mangen = "0.3.4"

[package]
default-run = "belt"
description = "A CLI toolbelt"
edition = "2024"
license = "MIT"
name = "belt-cli"
publish = false
readme = "README.md"
repository = "https://github.com/synmux/belt"
version = "0.0.0-pre.0"

[dependencies]
clap = { version = "4.6.7", features = [
  "derive",
  "env",
  "unicode",
  "wrap_help",
  "string",
  "suggestions",
  "error-context",
  "help",
  "usage",
  "color",
] }
crossterm = { version = "0.29.0", features = ["serde", "osc52"] }
ratatui = { version = "0.30.2", features = [
  "serde",
  "palette",
  "scrolling-regions",
  "crossterm",
] }

[[bin]]
name = "belt"
path = "src/main.rs"
